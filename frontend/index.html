<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thunderbot — Northstar Support</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">
    <header id="chat-header">
      <div class="orb" aria-hidden="true"></div>
      <div class="header-text">
        <h1>Thunderbot</h1>
        <p>Ask about your order status or a return/refund.</p>
      </div>
    </header>

    <main id="chat-window" aria-live="polite">
      <div class="message bot-message">
        Hi! I'm Thunderbot. I can help with <strong>order status</strong> or <strong>returns & refunds</strong>. What do you need help with?
      </div>
    </main>

    <div id="typing-indicator" class="typing-indicator hidden">
      <div class="orb orb-small"></div>
      <span>Thunderbot is typing...</span>
    </div>

    <form id="chat-form">
      <input
        type="text"
        id="chat-input"
        placeholder="Type your message..."
        autocomplete="off"
        required
      />
      <button type="submit" id="send-button">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
