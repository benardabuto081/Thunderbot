name: Thunderbot Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    name: Automated quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/package-lock.json') != '' }}
        working-directory: backend
        run: npm ci

      - name: Check backend JavaScript syntax
        if: ${{ hashFiles('backend/src/**/*.js') != '' }}
        run: |
          find backend/src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Start backend and verify health endpoint
        if: ${{ hashFiles('backend/src/server.js') != '' }}
        working-directory: backend
        run: |
          node src/server.js > /tmp/thunderbot-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:3000/health

      - name: Run chatbot intent test
        if: ${{ hashFiles('chatbot/testIntentDetector.js') != '' }}
        run: node chatbot/testIntentDetector.js
